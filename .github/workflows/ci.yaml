name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: zip
            - run: composer install --no-interaction --prefer-dist --no-progress
            - run: vendor/bin/phpunit --testsuite "Unit Tests"

    driver-tests:
        name: PHP ${{ matrix.php }} - ${{ matrix.db }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.4']
                db: ['mysql', 'pgsql', 'sqlite']

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: testdb
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -uroot -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: testdb
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres -d testdb"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, zip
                  coverage: none

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Run SQLite tests
              if: matrix.db == 'sqlite'
              run: vendor/bin/phpunit --filter "Sqlite"

            - name: Run MySQL tests
              if: matrix.db == 'mysql'
              env:
                  MYSQL_DSN: mysql:host=127.0.0.1;dbname=testdb;charset=utf8mb4
                  MYSQL_USER: root
                  MYSQL_PASSWORD: root
              run: vendor/bin/phpunit --filter "Mysql"

            - name: Run PostgreSQL tests
              if: matrix.db == 'pgsql'
              env:
                  PGSQL_DSN: pgsql:host=127.0.0.1;dbname=testdb
                  PGSQL_USER: postgres
                  PGSQL_PASSWORD: postgres
              run: vendor/bin/phpunit --filter "Pgsql"
