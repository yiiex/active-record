services:
    php:
        build:
            context: .
            dockerfile: _docker/php/Dockerfile
        volumes:
            - ./:/app
            - /app/vendor
        working_dir: /app
        depends_on:
            mysql:
                condition: service_healthy
            postgres:
                condition: service_healthy
        env_file: .env
        networks:
            - test-network

    mysql:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - test-network

    postgres:
        image: postgres:16
        environment:
            POSTGRES_PASSWORD: ${PGSQL_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${PGSQL_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - test-network

volumes:
    mysql-data:
    postgres-data:

networks:
    test-network:
